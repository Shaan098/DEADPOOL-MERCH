<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Deadpool</title>
    <link rel="stylesheet" href="site.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">Dead<span>pool</span></a>
        <div class="menu" id="menu">&#9776;</div>
        <ul class="nav" id="nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="explore.html">Explore</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="cart.html" class="cart-icon">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </a>
    </header>

    <section class="cart-section">
        <div class="cart-container">
            <h1>Shopping <span>Cart</span></h1>

            <div class="cart-content" id="cartContent">
                <!-- Cart items will be inserted here -->
            </div>

            <div class="cart-summary" id="cartSummary">
                <!-- Summary will be inserted here -->
            </div>
        </div>
    </section>

    <script src="site.js"></script>
    <script>
        // Load and display cart
        function displayCart() {
            const cart = JSON.parse(localStorage.getItem('deadpoolCart')) || [];
            const cartContent = document.getElementById('cartContent');
            const cartSummary = document.getElementById('cartSummary');

            if (cart.length === 0) {
                cartContent.innerHTML = `
            <div class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Add some awesome Deadpool merch!</p>
                <a href="explore.html" class="btn">Explore Products</a>
            </div>
        `;
                cartSummary.innerHTML = '';
                return;
            }

            // Display cart items
            let cartHTML = '<div class="cart-items">';
            cart.forEach((item, index) => {
                cartHTML += `
            <div class="cart-item">
                <img src="${item.image}" alt="${item.name}">
                <div class="item-details">
                    <h3>${item.name}</h3>
                    <p class="item-price">$${item.price.toFixed(2)}</p>
                </div>
                <div class="item-quantity">
                    <button onclick="updateQuantity(${index}, -1)" class="qty-btn">-</button>
                    <span class="qty">${item.quantity}</span>
                    <button onclick="updateQuantity(${index}, 1)" class="qty-btn">+</button>
                </div>
                <div class="item-total">$${(item.price * item.quantity).toFixed(2)}</div>
                <button onclick="removeItem(${index})" class="remove-btn">✕</button>
            </div>
        `;
            });
            cartHTML += '</div>';
            cartContent.innerHTML = cartHTML;

            // Calculate totals
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.1; // 10% tax
            const total = subtotal + tax;

            // Display summary
            cartSummary.innerHTML = `
        <div class="summary-card">
            <h2>Order Summary</h2>
            <div class="summary-line">
                <span>Subtotal:</span>
                <span>$${subtotal.toFixed(2)}</span>
            </div>
            <div class="summary-line">
                <span>Tax (10%):</span>
                <span>$${tax.toFixed(2)}</span>
            </div>
            <div class="summary-line total">
                <span>Total:</span>
                <span>$${total.toFixed(2)}</span>
            </div>
            <button class="btn checkout-btn" onclick="checkout()">Proceed to Checkout</button>
            <a href="explore.html" class="btn btn-outline">Continue Shopping</a>
        </div>
    `;
        }

        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem('deadpoolCart')) || [];
            cart[index].quantity += change;

            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem('deadpoolCart', JSON.stringify(cart));
            displayCart();
            updateCartCount();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('deadpoolCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('deadpoolCart', JSON.stringify(cart));
            displayCart();
            updateCartCount();
        }

        function checkout() {
            alert('Checkout functionality coming soon! Maximum effort! 💀');
        }

        // Display cart on page load
        displayCart();
    </script>
</body>

</html>
